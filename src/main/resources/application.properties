spring.application.name=HealthMateLC
spring.config.import=optional:classpath:local-application.properties

# Database Configuration
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.frontend.base-url=https://wykowjbu.github.io/HealthMateLC
#app.redirect-urls.base=http://127.0.0.1:5500
app.redirect-urls.base=https://wykowjbu.github.io/HealthMateLC
app.redirect-urls.admin=${app.redirect-urls.base}/admin.html
app.redirect-urls.manager=${app.redirect-urls.base}/manager.html
app.redirect-urls.employee=${app.redirect-urls.base}/employee.html
app.redirect-urls.customerservice=${app.redirect-urls.base}/customer-service.html
app.redirect-urls.default=${app.redirect-urls.base}/default.html

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.path=/
server.servlet.session.cookie.domain=localhost
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.name=JSESSIONID
